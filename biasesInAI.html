  <!--Gender Bias Info-->
  <img src="assets/genderBias.png" alt="1) Gender Bias: Since facial recognition technologies are predominantly created and tested by men, they are also less likely to fail on men. Credence in machine neutrality is misleading, as technology tends to reflect those who created it. Early algorithms struggled to detect women and people of color. While the circumstances have improved, Al is far from perfect. Women have both a higher false match rate and false non-match rate." draggable="false">
  
  <!--Gender Bias Quote-->
  <img src="assets/genderBiasQuote.png" alt="Jon Schuppe explains, '[Joy Buolamwini] has also showed that facial recognition systems are unable to determine the gender of famous black women, including Oprah Winfrey, Serena Williams and Michelle Obama.'" draggable="false">

  <!--Racial Bias Info-->
  <img src="assets/racialBias.png" alt="2) Racial Bias: While working on a project at MIT, Dr. Joy Buolamwini's face could not be detected by facial analysis software as easily as her peers with lighter skin. Facial recognition can be used to surveil and target people of color. Since African Americans, Latinos, and immigrants have a higher likelihood of being included in mugshot databases, these people are more likely to be 'findable' by facial recognition technology. Training data often does not contain diverse subjects, so facial recognition technology struggles to distinguish the faces of people with darker skin." draggable="false">

  <!--Racial Bias Quote-->
  <img src="assets/racialBiasQuote.png" alt="Lisa Vaas explains, '[Facial recognition algorithms] are trained by white people on mostly white faces. Facial recognition algorithms have hence been found to be less accurate at identifying black faces.'" draggable="false">

  <!--Age Bias Info-->
  <img src="assets/ageBias.png" alt="3) Age Bias: Face ID is more likely to fail on young people. Children under the age of 13 are more susceptible to false matches since their facial features have not fully developed yet. Additionally, some kids can access their parent's devices. If a child is a spitting image of their parent, they might be able to unlock their parent's phone. This raises additional privacy concerns.If someone isn't aware another person can log into their device, the intruder could uncover private information unbeknownst to the victim." draggable="false">

  <!--Age Bias Quote-->
  <img src="assets/ageBiasQuote.png" alt="Attaullah Malik, who's son's face can open his wife's phone, says, 'If my son had access to my wife's phone…. he could order ice cream for himself whenever he wanted.'" draggable="false">

  <!--Twins and Siblings Bias Info-->
  <img src="assets/twinBias.png" alt="4) Twins and Siblings: Face ID, although secure for most, has much lower security levels when it comes to twins and identical siblings. 'False matches' are much more likely among twins and siblings that look alike, and the odds of someone else being able to unlock your device drastically increase. Some twins are especially upset by this. A pair of Russian brothers sued Apple when their new iPhones couldn't distinguish them, demanding $357,000 and that the company improves the feature." draggable="false">

  <!--Twins and Siblings Bias Quote-->
  <img src="assets/twinBiasQuote.png" alt="Apple Support concedes, 'The statistical probability [of a random person unlocking your phone using Face ID] is higher - and further increased using Face ID with a mask - for twins and siblings that look like you.'" draggable="false">
